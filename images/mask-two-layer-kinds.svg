tle>e0: score 0.62</title></rect><text x="289" y="107" class="t-s" text-anchor="middle">unchanged</text><rect x="334" y="94" width="62" height="18" rx="9" class="s-ok"/><text x="365" y="107" class="t t-w" text-anchor="middle">w 0.16</text><text x="26" y="135" class="t">e1</text><rect x="92" y="124" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="124" width="120" height="14" rx="3" style="fill: #56617B"><title>e1: score 0.80</title></rect><rect x="254" y="122" width="70" height="18" rx="9" class="s-reap"/><text x="289" y="135" class="t t-w" text-anchor="middle">-1e4</text><text x="334" y="135" class="t-s">never picked</text><text x="26" y="163" class="t">e2</text><rect x="92" y="152" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="152" width="52.5" height="14" rx="3" style="fill: #5B45D6"><title>e2: score 0.35</title></rect><text x="289" y="163" class="t-s" text-anchor="middle">unchanged</text><text x="334" y="163" class="t-s">not in top-6</text><text x="26" y="191" class="t">e3</text><rect x="92" y="180" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="180" width="106.5" height="14" rx="3" style="fill: #5B45D6"><title>e3: score 0.71</title></rect><text x="289" y="191" class="t-s" text-anchor="middle">unchanged</text><rect x="334" y="178" width="62" height="18" rx="9" class="s-ok"/><text x="365" y="191" class="t t-w" text-anchor="middle">w 0.18</text><text x="26" y="219" class="t">e4</text><rect x="92" y="208" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="208" width="42" height="14" rx="3" style="fill: #5B45D6"><title>e4: score 0.28</title></rect><text x="289" y="219" class="t-s" text-anchor="middle">unchanged</text><text x="334" y="219" class="t-s">not in top-6</text><text x="26" y="247" class="t">e5</text><rect x="92" y="236" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="236" width="82.5" height="14" rx="3" style="fill: #5B45D6"><title>e5: score 0.55</title></rect><text x="289" y="247" class="t-s" text-anchor="middle">unchanged</text><rect x="334" y="234" width="62" height="18" rx="9" class="s-ok"/><text x="365" y="247" class="t t-w" text-anchor="middle">w 0.14</text><text x="26" y="275" class="t">e6</text><rect x="92" y="264" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="264" width="135" height="14" rx="3" style="fill: #5B45D6"><title>e6: score 0.90</title></rect><text x="289" y="275" class="t-s" text-anchor="middle">unchanged</text><rect x="334" y="262" width="62" height="18" rx="9" class="s-ok"/><text x="365" y="275" class="t t-w" text-anchor="middle">w 0.23</text><text x="26" y="303" class="t">e7</text><rect x="92" y="292" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="292" width="61.5" height="14" rx="3" style="fill: #5B45D6"><title>e7: score 0.41</title></rect><text x="289" y="303" class="t-s" text-anchor="middle">unchanged</text><rect x="334" y="290" width="62" height="18" rx="9" class="s-ok"/><text x="365" y="303" class="t t-w" text-anchor="middle">w 0.11</text><text x="26" y="331" class="t">e8</text><rect x="92" y="320" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="320" width="30" height="14" rx="3" style="fill: #56617B"><title>e8: score 0.20</title></rect><rect x="254" y="318" width="70" height="18" rx="9" class="s-reap"/><text x="289" y="331" class="t t-w" text-anchor="middle">-1e4</text><text x="334" y="331" class="t-s">never picked</text><text x="26" y="359" class="t">e9</text><rect x="92" y="348" width="150" height="14" rx="3" class="s-line"/><rect x="92" y="348" width="99" height="14" rx="3" style="fill: #5B45D6"><title>e9: score 0.66</title></rect><text x="289" y="359" class="t-s" text-anchor="middle">unchanged</text><rect x="334" y="346" width="62" height="18" rx="9" class="s-ok"/><text x="365" y="359" class="t t-w" text-anchor="middle">w 0.17</text><text x="26" y="386" class="t-s">Without the mask, e1 (score 0.80) is in the top-6.</text><text x="26" y="402" class="t-s">With the mask, e7 takes its place. The weights w come</text><text x="26" y="418" class="t-s">from s only and sum to 1 over the six picks, so the kept</text><text x="26" y="434" class="t-s">experts keep their choice and their weights.</text><rect x="430" y="10" width="400" height="450" rx="10" class="s-bg"/><text x="446" y="38" class="t-b">Layers 0 to 2: hash routing</text><text x="446" y="56" class="t-s">tid2eid: a fixed table, token id to 6 expert ids. Toy ids.</text><text x="446" y="82" class="t-s">Row of token 4517 before the mask</text><rect x="464" y="90" width="46" height="28" rx="5" class="s-surface"/><rect x="464" y="90" width="46" height="28" rx="5" class="st-line"/><text x="487" y="108" class="t" text-anchor="middle">12</text><rect x="516" y="90" width="46" height="28" rx="5" class="s-surface"/><rect x="516" y="90" width="46" height="28" rx="5" class="st-line"/><text x="539" y="108" class="t" text-anchor="middle">87</text><rect x="568" y="90" width="46" height="28" rx="5" class="s-surface"/><rect x="568" y="90" width="46" height="28" rx="5" class="st-line"/><text x="591" y="108" class="t" text-anchor="middle">140</text><rect x="620" y="90" width="46" height="28" rx="5" class="s-reap"><title>expert 205 is dropped</title></rect><text x="643" y="108" class="t t-w" text-anchor="middle">205</text><rect x="672" y="90" width="46" height="28" rx="5" class="s-surface"/><rect x="672" y="90" width="46" height="28" rx="5" class="st-line"/><text x="695" y="108" class="t" text-anchor="middle">63</text><rect x="724" y="90" width="46" height="28" rx="5" class="s-surface"/><rect x="724" y="90" width="46" height="28" rx="5" class="st-line"/><text x="747" y="108" class="t" text-anchor="middle">9</text><text x="446" y="152" class="t-s">Candidates for 205: kept experts, most similar</text><text x="446" y="166" class="t-s">router row first (cosine of gate.weight rows)</text><rect x="464" y="182" width="46" height="24" rx="5" class="s-line"/><text x="487" y="198" class="t" text-anchor="middle">140</text><text x="522" y="198" class="t">cos 0.83</text><text x="600" y="198" class="t-s">already in the row</text><line x1="460" y1="194" x2="514" y2="194" class="st-bad" stroke-width="2"/><rect x="464" y="216" width="46" height="24" rx="5" class="s-line"/><text x="487" y="232" class="t" text-anchor="middle">31</text><text x="522" y="232" class="t">cos 0.79</text><text x="600" y="232" class="t-s">load above 2 x the mean</text><line x1="460" y1="228" x2="514" y2="228" class="st-bad" stroke-width="2"/><rect x="464" y="250" width="46" height="24" rx="5" class="s-ok"/><text x="487" y="266" class="t t-w" text-anchor="middle">118</text><text x="522" y="266" class="t">cos 0.74</text><text x="600" y="266" class="t">takes the entry</text><line x1="620" y1="290" x2="620" y2="312" class="st-muted" stroke-width="1.5" marker-end="url(#b-arrow)"/><text x="446" y="326" class="t-s">The same row in the mask folder</text><rect x="464" y="334" width="46" height="28" rx="5" class="s-surface"/><rect x="464" y="334" width="46" height="28" rx="5" class="st-line"/><text x="487" y="352" class="t" text-anchor="middle">12</text><rect x="516" y="334" width="46" height="28" rx="5" class="s-surface"/><rect x="516" y="334" width="46" height="28" rx="5" class="st-line"/><text x="539" y="352" class="t" text-anchor="middle">87</text><rect x="568" y="334" width="46" height="28" rx="5" class="s-surface"/><rect x="568" y="334" width="46" height="28" rx="5" class="st-line"/><text x="591" y="352" class="t" text-anchor="middle">140</text><rect x="620" y="334" width="46" height="28" rx="5" class="s-ok"><title>expert 118 is the new entry</title></rect><text x="643" y="352" class="t t-w" text-anchor="middle">118</text><rect x="672" y="334" width="46" height="28" rx="5" class="s-surface"/><rect x="672" y="334" width="46" height="28" rx="5" class="st-line"/><text x="695" y="352" class="t" text-anchor="middle">63</text><rect x="724" y="334" width="46" height="28" rx="5" class="s-surface"/><rect x="724" y="334" width="46" height="28" rx="5" class="st-line"/><text x="747" y="352" class="t" text-anchor="middle">9</text><rect x="446" y="374" width="368" height="78" rx="8" class="s-surface"/><rect x="446" y="374" width="368" height="78" rx="8" class="st-line"/><text x="460" y="392" class="t-s">MASK.json records the dropped ids,</text><text x="460" y="407" class="t-s">the rule and the moved entries.</text><text x="460" y="424" class="t-s">Bot K 160, layers 0 / 1 / 2:</text><text x="460" y="441" class="t">166,409 / 170,172 / 166,531 moved</text></svg>

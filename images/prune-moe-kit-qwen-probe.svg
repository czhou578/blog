<svg viewBox="-16 -16 792 516" width="792" height="516" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The probe against the prune by hand on Qwen3.6-35B-A3B: the NLL change of three cuts, with the 90% band of each probe value and the +3% limit</title>

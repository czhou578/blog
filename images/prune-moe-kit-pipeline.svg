<svg viewBox="-16 -16 792 388" width="792" height="388" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The pipeline of prune-moe-kit: eight stages, what each stage writes, and the adapter parts of a model</title>
<desc>Stages in order: 0 preflight (memory table and verdict), 1 data (calibration set and held-out set), 2 capture (expert counts of each layer), 3 rank (rank file), 4 screen, by hand (cuts that pass a replay), 5 prune (pruned folder), 6 gates (report), 7 decision, by hand (your choice). The code of the six command stages is the same for each model. The capture and the gates use the server and the chat template of the model. The prune uses the checkpoint layout of the model.</desc>
<style>.t{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;fill:#131A2E}.t-s{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:10.5px;fill:#56617B}.t-m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;font-weight:600;fill:#131A2E}.t-b{font-family:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;font-size:15px;font-weight:700;fill:#131A2E}</style>
<rect x="-15.5" y="-15.5" width="791" height="387" rx="10" fill="#FFFFFF" stroke="#D8DDEA"/>
<text x="0" y="12" class="t-b">The pipeline: eight stages, and three adapter parts</text>
<rect x="0" y="31" width="14" height="14" rx="4" fill="#5B45D6" fill-opacity="0.14" stroke="#5B45D6" stroke-width="1.5"/>
<text x="22" y="42" class="t" text-anchor="start">Shared code: the same for each model</text>
<rect x="0" y="51" width="14" height="14" rx="4" fill="#C2410C" fill-opacity="0.14" stroke="#C2410C" stroke-width="1.5"/>
<text x="22" y="62" class="t" text-anchor="start">Adapter part: one for each model</text>
<rect x="0" y="71" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#56617B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="22" y="82" class="t" text-anchor="start">By hand: no command</text>
<text x="0" y="118" class="t-s" text-anchor="start">The stages, in order</text>
<text x="0" y="216" class="t-s" text-anchor="start">Each stage writes</text>
<text x="0" y="282" class="t-s" text-anchor="start">The adapter parts that a stage uses</text>
<rect x="0.0" y="128" width="84" height="56" rx="6" fill="#5B45D6" fill-opacity="0.14" stroke="#5B45D6" stroke-width="1.5"/>
<text x="42.0" y="150" class="t-s" text-anchor="middle">Stage 0</text>
<text x="42.0" y="169" class="t-m" text-anchor="middle">preflight</text>
<path d="M86.5 156 h7 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#56617B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42.0" y="236" class="t" text-anchor="middle" style="font-size:10.5px">memory table,</text>
<text x="42.0" y="251" class="t" text-anchor="middle" style="font-size:10.5px">verdict</text>
<rect x="96.5" y="128" width="84" height="56" rx="6" fill="#5B45D6" fill-opacity="0.14" stroke="#5B45D6" stroke-width="1.5"/>
<text x="138.5" y="150" class="t-s" text-anchor="middle">Stage 1</text>
<text x="138.5" y="169" class="t-m" text-anchor="middle">data</text>
<path d="M183.0 156 h7 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#56617B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="138.5" y="236" class="t" text-anchor="middle" style="font-size:10.5px">calibration set</text>
<text x="138.5" y="251" class="t" text-anchor="middle" style="font-size:10.5px">held-out set</text>
<rect x="193.0" y="128" width="84" height="56" rx="6" fill="#5B45D6" fill-opacity="0.14" stroke="#5B45D6" stroke-width="1.5"/>
<text x="235.0" y="150" class="t-s" text-anchor="middle">Stage 2</text>
<text x="235.0" y="169" class="t-m" text-anchor="middle">capture</text>
<path d="M279.5 156 h7 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#56617B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="235.0" y="236" class="t" text-anchor="middle" style="font-size:10.5px">expert counts</text>
<text x="235.0" y="251" class="t" text-anchor="middle" style="font-size:10.5px">of each layer</text>
<rect x="189.0" y="292" width="92" height="26" rx="6" fill="#C2410C" fill-opacity="0.14" stroke="#C2410C" stroke-width="1.5"/>
<text x="235.0" y="309" class="t" text-anchor="middle" style="font-size:10.5px">server</text>
<rect x="189.0" y="326" width="92" height="26" rx="6" fill="#C2410C" fill-opacity="0.14" stroke="#C2410C" stroke-width="1.5"/>
<text x="235.0" y="343" class="t" text-anchor="middle" style="font-size:10.5px">chat template</text>
<line x1="235.0" y1="184" x2="235.0" y2="222" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="235.0" y1="258" x2="235.0" y2="292" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="2 3"/>
<rect x="289.5" y="128" width="84" height="56" rx="6" fill="#5B45D6" fill-opacity="0.14" stroke="#5B45D6" stroke-width="1.5"/>
<text x="331.5" y="150" class="t-s" text-anchor="middle">Stage 3</text>
<text x="331.5" y="169" class="t-m" text-anchor="middle">rank</text>
<path d="M376.0 156 h7 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#56617B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="331.5" y="236" class="t" text-anchor="middle" style="font-size:10.5px">rank file</text>
<rect x="386.0" y="128" width="84" height="56" rx="6" fill="#FFFFFF" stroke="#56617B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="428.0" y="150" class="t-s" text-anchor="middle">Stage 4</text>
<text x="428.0" y="169" class="t-m" text-anchor="middle">screen</text>
<path d="M472.5 156 h7 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#56617B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="428.0" y="236" class="t" text-anchor="middle" style="font-size:10.5px">cuts that</text>
<text x="428.0" y="251" class="t" text-anchor="middle" style="font-size:10.5px">pass a replay</text>
<rect x="482.5" y="128" width="84" height="56" rx="6" fill="#5B45D6" fill-opacity="0.14" stroke="#5B45D6" stroke-width="1.5"/>
<text x="524.5" y="150" class="t-s" text-anchor="middle">Stage 5</text>
<text x="524.5" y="169" class="t-m" text-anchor="middle">prune</text>
<path d="M569.0 156 h7 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#56617B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="524.5" y="236" class="t" text-anchor="middle" style="font-size:10.5px">pruned folder</text>
<rect x="478.5" y="292" width="92" height="40" rx="6" fill="#C2410C" fill-opacity="0.14" stroke="#C2410C" stroke-width="1.5"/>
<text x="524.5" y="309" class="t" text-anchor="middle" style="font-size:10.5px">checkpoint</text>
<text x="524.5" y="323" class="t" text-anchor="middle" style="font-size:10.5px">layout</text>
<line x1="524.5" y1="184" x2="524.5" y2="222" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="524.5" y1="243" x2="524.5" y2="292" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="2 3"/>
<rect x="579.0" y="128" width="84" height="56" rx="6" fill="#5B45D6" fill-opacity="0.14" stroke="#5B45D6" stroke-width="1.5"/>
<text x="621.0" y="150" class="t-s" text-anchor="middle">Stage 6</text>
<text x="621.0" y="169" class="t-m" text-anchor="middle">gates</text>
<path d="M665.5 156 h7 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#56617B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="621.0" y="236" class="t" text-anchor="middle" style="font-size:10.5px">report</text>
<rect x="575.0" y="292" width="92" height="26" rx="6" fill="#C2410C" fill-opacity="0.14" stroke="#C2410C" stroke-width="1.5"/>
<text x="621.0" y="309" class="t" text-anchor="middle" style="font-size:10.5px">server</text>
<rect x="575.0" y="326" width="92" height="26" rx="6" fill="#C2410C" fill-opacity="0.14" stroke="#C2410C" stroke-width="1.5"/>
<text x="621.0" y="343" class="t" text-anchor="middle" style="font-size:10.5px">chat template</text>
<line x1="621.0" y1="184" x2="621.0" y2="222" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="621.0" y1="243" x2="621.0" y2="292" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="2 3"/>
<rect x="675.5" y="128" width="84" height="56" rx="6" fill="#FFFFFF" stroke="#56617B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="717.5" y="150" class="t-s" text-anchor="middle">Stage 7</text>
<text x="717.5" y="169" class="t-m" text-anchor="middle">decision</text>
<text x="717.5" y="236" class="t" text-anchor="middle" style="font-size:10.5px">your choice</text>
</svg>

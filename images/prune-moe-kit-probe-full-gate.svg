<svg viewBox="-16 -16 792 516" width="792" height="516" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The probe against the full gate on Inkling-2-Mini: the NLL change of three cuts, with the 90% band of each value and the +3% limit</title>
<desc>Probe (450,383 tokens, 20 turns, 41 minutes): K 120 +0.72% (band +0.24% to +1.21%), K 112 +2.01% (band +1.14% to +3.29%), K 104 +3.75% (band +2.42% to +5.53%). Full gate (3,974,504 tokens, 60 turns, 103 minutes): K 120 +0.69%, K 112 +1.97%, K 104 +4.24%. Each value of the full gate is inside the band of the probe.</desc>
<style>.t{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;fill:#131A2E}.t-s{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:10.5px;fill:#56617B}.t-b{font-family:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;font-size:15px;font-weight:700;fill:#131A2E}</style>

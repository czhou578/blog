<svg viewBox="-16 -16 932 502" width="932" height="502" role="img" xmlns="http://www.w3.org/2000/svg"><title>The prune tool, from the mask folder to the pruned folder</title><desc>The mask folder links to the stock folder. A root container with no network runs the tool. The output folder has 46 rewritten weight files, edited JSON files and symlinks for the rest.</desc><style>.s-ph{fill:#237A3B}.st-ph{stroke:#237A3B;fill:none}.s-ink{fill:#131A2E}.s-muted{fill:#56617B}.s-surface{fill:#FFFFFF}.s-bg{fill:#F3F5FA}.s-line{fill:#D8DDEA}.s-ok{fill:#1F7A36}.s-bad{fill:#C42B2B}.s-warn{fill:#9A6200}.s-goal{fill:#6B4E16}.s-measure{fill:#0B7F86}.s-reap{fill:#C2410C}.s-bot{fill:#5B45D6}.s-topk{fill:#A86A00}.s-review{fill:#B02A6B}.s-prune{fill:#237A3B}.s-ship{fill:#1D63C4}.st-ink{stroke:#131A2E;fill:none}.st-muted{stroke:#56617B;fill:none}.st-line{stroke:#D8DDEA;fill:none}.st-ok{stroke:#1F7A36;fill:none}.st-bad{stroke:#C42B2B;fill:none}.t{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;fill:#131A2E}.t-s{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:10.5px;fill:#56617B}.t-b{font-family:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;font-size:15px;font-weight:700;fill:#131A2E}.t-w{fill:#FFFFFF}</style><rect x="-15.5" y="-15.5" width="931" height="501" rx="10" fill="#FFFFFF" stroke="#D8DDEA"/><defs><marker id="c-s09p-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="s-muted"/></marker></defs><rect x="10" y="40" width="240" height="112" rx="8" class="s-bg"/><rect x="10" y="40" width="240" height="112" rx="8" class="st-line" fill="none"/><text x="24" y="66" class="t-b">data/tp1</text><text x="24" y="86" class="t-s">the stock folder, 216 experts</text><text x="24" y="104" class="t-s">43 expert files: root, mode 600</text><text x="24" y="122" class="t-s">mounted read-only</text><text x="24" y="140" class="t-s">never changed</text><rect x="10" y="210" width="240" height="160" rx="8" class="s-bg"/><rect x="10" y="210" width="240" height="160" rx="8" class="st-line" fill="none"/><text x="24" y="236" class="t-b">tp1-botmask5-k160</text><text x="24" y="256" class="t-s">the mask of Step 07 (the source)</text><text x="24" y="278" class="t-s">MASK.json: 56 drop ids per layer</text><text x="24" y="296" class="t-s">carried-001 to 003: masked router</text><text x="24" y="314" class="t-s">TOPK.json: top-k 5</text><text x="24" y="332" class="t-s">43 expert files: links to data/tp1</text><text x="24" y="350" class="t-s">loads 95.39 GiB</text><line x1="125" y1="154" x2="125" y2="206" class="st-muted" fill="none" stroke-dasharray="4 4" marker-start="url(#c-s09p-arr)"/><text x="133" y="184" class="t-s">links</text><rect x="288" y="30" width="310" height="392" rx="12" class="st-ink" fill="none" stroke-dasharray="6 5" stroke-width="1.5"/><text x="304" y="56" class="t-b">Root container (prune_run.sh)</text><text x="304" y="76" class="t-s">server image · --network none</text><text x="304" y="92" class="t-s">--memory 8g · data/tp1 read-only</text><text x="304" y="108" class="t-s">dsv4-specialize read-write</text><rect x="304" y="124" width="278" height="32" rx="7" class="s-muted"/><text x="318" y="145" class="t t-w">1  run the unit tests</text><rect x="304" y="165" width="278" height="32" rx="7" class="s-muted"/><text x="318" y="186" class="t t-w">2  read the keep map (MASK.json)</text><rect x="304" y="206" width="278" height="32" rx="7" class="s-ph"/><text x="318" y="227" class="t t-w">3  copy 12 x 160 tensors per layer</text><rect x="304" y="247" width="278" height="32" rx="7" class="s-ph"/><text x="318" y="268" class="t t-w">4  slice gate rows, bias, tid2eid</text><rect x="304" y="288" width="278" height="32" rx="7" class="s-ship"/><text x="318" y="309" class="t t-w">5  edit config, index, manifest</text><rect x="304" y="329" width="278" height="32" rx="7" class="s-ship"/><text x="318" y="350" class="t t-w">6  self-check, verify_tp1_manifest</text><rect x="304" y="370" width="278" height="32" rx="7" class="s-muted"/><text x="318" y="391" class="t t-w">7  give the files to my user</text><line x1="252" y1="290" x2="284" y2="290" class="st-muted" fill="none" stroke-width="1.6" marker-end="url(#c-s09p-arr)"/><line x1="600" y1="240" x2="616" y2="240" class="st-muted" fill="none" stroke-width="1.6" marker-end="url(#c-s09p-arr)"/><text x="620" y="30" class="t-b">tp1-prune5-k160</text><text x="620" y="48" class="t-s">now data/tp1-k160t5, loads 74.09 GiB</text><rect x="620" y="60" width="270" height="50" rx="8" class="s-ph"/><text x="632" y="81" class="t t-w">43 expert files rewritten</text><text x="632" y="99" class="t-s t-w">12 x 160 tensors each (was 12 x 216)</text><rect x="620" y="118" width="270" height="50" rx="8" class="s-ph"/><text x="632" y="139" class="t t-w">3 carried files rewritten</text><text x="632" y="157" class="t-s t-w">gate.weight, gate.bias, tid2eid</text><rect x="620" y="176" width="270" height="50" rx="8" class="s-ship"/><text x="632" y="197" class="t t-w">5 JSON files edited</text><text x="632" y="215" class="t-s t-w">counts, weight index, bitmap, manifest</text><rect x="620" y="234" width="270" height="50" rx="8" class="s-topk"/><text x="632" y="255" class="t t-w">2 new files</text><text x="632" y="273" class="t-s t-w">REAP_K160_PLAN.json, PRUNE.json</text><rect x="620" y="292" width="270" height="50" rx="8" class="s-muted"/><text x="632" y="313" class="t t-w">2 files copied</text><text x="632" y="331" class="t-s t-w">MASK.json, TOPK.json</text><rect x="620" y="350" width="270" height="50" rx="8" class="s-surface"/><rect x="620" y="350" width="270" height="50" rx="8" class="st-muted" fill="none" stroke-dasharray="4 3"/><text x="632" y="371" class="t">11 symlinks into data/tp1</text><text x="632" y="389" class="t-s">carried-004/005, tokenizer and more</text><rect x="10" y="434" width="880" height="30" rx="6" class="s-bg"/><text x="450" y="454" class="t" text-anchor="middle">46 files rewritten · 28,896 tensors removed · 21.27 GiB of tensor data · 73 GB on disk · 18:51 to 19:02</text></svg>

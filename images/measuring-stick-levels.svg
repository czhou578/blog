<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-16 -16 842 412" width="842" height="412" role="img" xmlns="http://www.w3.org/2000/svg"><title id="a-f4-title">The three levels of the measuring stick</title><desc>A funnel of three levels. Replay screen: about 35 to 39 minutes, NLL noise 0.23%. Speed tests: about 20 to 30 minutes, noise 4.2%. Full runs: about 4 hours per run, the judge gives a net loss of 13% to 20% on two runs of the same model.</desc><style>.s-ink{fill:#131A2E}.s-muted{fill:#56617B}.s-surface{fill:#FFFFFF}.s-bg{fill:#F3F5FA}.s-line{fill:#D8DDEA}.s-ok{fill:#1F7A36}.s-bad{fill:#C42B2B}.s-warn{fill:#9A6200}.s-goal{fill:#6B4E16}.s-measure{fill:#0B7F86}.s-reap{fill:#C2410C}.s-bot{fill:#5B45D6}.s-topk{fill:#A86A00}.s-review{fill:#B02A6B}.s-prune{fill:#237A3B}.s-ship{fill:#1D63C4}.st-ink{stroke:#131A2E;fill:none}.st-muted{stroke:#56617B;fill:none}.st-line{stroke:#D8DDEA;fill:none}.st-ok{stroke:#1F7A36;fill:none}.st-bad{stroke:#C42B2B;fill:none}.t{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;fill:#131A2E}.t-s{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:10.5px;fill:#56617B}.t-b{font-family:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;font-size:15px;font-weight:700;fill:#131A2E}.t-w{fill:#FFFFFF}</style><rect x="-15.5" y="-15.5" width="841" height="411" rx="10" fill="#FFFFFF" stroke="#D8DDEA"/><defs><marker id="a-f4-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="s-muted"/></marker></defs><text x="180.0" y="28.0" class="t-s" text-anchor="end" font-weight="600" letter-spacing="1">TIME</text><text x="400.0" y="28.0" class="t-s" text-anchor="middle" font-weight="600" letter-spacing="1">COST GOES UP, POINTS GO DOWN</text><text x="625.0" y="28.0" class="t-s" font-weight="600" letter-spacing="1">NOISE</text><polygon points="200.0,46 600.0,46 565.0,128 235.0,128" class="s-measure"/><text x="400.0" y="76.0" class="t-b t-w" text-anchor="middle">1  Replay screen</text><text x="400.0" y="96.0" class="t t-w" text-anchor="middle">NLL and tool names, 60 targets</text><text x="400.0" y="113.0" class="t-s t-w" text-anchor="middle">every grid point</text><text x="180.0" y="82.0" class="t" text-anchor="end">about 35 to 39 min</text><text x="180.0" y="98.0" class="t-s" text-anchor="end">per point</text><text x="625.0" y="82.0" class="t">NLL: 0.23%</text><text x="625.0" y="98.0" class="t-s">tool names: 0 of 83 changed</text><line x1="186.0" y1="87.0" x2="196.0" y2="87.0" class="st-line" stroke-dasharray="2 3"/><line x1="604.0" y1="87.0" x2="619.0" y2="87.0" class="st-line" stroke-dasharray="2 3"/><polygon points="235.0,140 565.0,140 530.0,222 270.0,222" class="s-measure"/><text x="400.0" y="170.0" class="t-b t-w" text-anchor="middle">2  Speed tests</text><text x="400.0" y="190.0" class="t t-w" text-anchor="middle">bot test + code test, tok/s</text><text x="400.0" y="207.0" class="t-s t-w" text-anchor="middle">points that pass the screen</text><text x="180.0" y="176.0" class="t" text-anchor="end">about 20 to 30 min</text><text x="180.0" y="192.0" class="t-s" text-anchor="end">per point</text><text x="625.0" y="176.0" class="t">decode rate: 4.2%</text><text x="625.0" y="192.0" class="t-s">(both tests)</text><line x1="186.0" y1="181.0" x2="231.0" y2="181.0" class="st-line" stroke-dasharray="2 3"/><line x1="569.0" y1="181.0" x2="619.0" y2="181.0" class="st-line" stroke-dasharray="2 3"/><polygon points="270.0,234 530.0,234 495.0,316 305.0,316" class="s-measure"/><text x="400.0" y="264.0" class="t-b t-w" text-anchor="middle">3  Full runs</text><text x="400.0" y="284.0" class="t t-w" text-anchor="middle">19 prompts, 5 checks, judge</text><text x="400.0" y="301.0" class="t-s t-w" text-anchor="middle">the best points and the pick</text><text x="180.0" y="270.0" class="t" text-anchor="end">about 4 h per run</text><text x="180.0" y="286.0" class="t-s" text-anchor="end">(2 h 21 to 2 h 49 for 15)</text><text x="625.0" y="270.0" class="t">judge, same model:</text><text x="625.0" y="286.0" class="t-s">net loss 13% to 20%</text><line x1="186.0" y1="275.0" x2="266.0" y2="275.0" class="st-line" stroke-dasharray="2 3"/><line x1="534.0" y1="275.0" x2="619.0" y2="275.0" class="st-line" stroke-dasharray="2 3"/><path d="M400,324 L400,346" class="st-muted" stroke-width="1.5" marker-end="url(#a-f4-arr)"/><text x="400.0" y="364.0" class="t-s" text-anchor="middle">the final review: 114 judge pairs and 20 blind pairs (Part 2)</text></svg>

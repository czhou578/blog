<svg viewBox="-16 -16 792 440" width="792" height="440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The looped layers of Inkling-2-Mini: 24 layers in the weights, 48 rows in the capture, and one keep list for each layer</title>
<desc>Layers 0 to 5 run one time, layers 6 to 17 run three times, and layers 18 to 23 run one time. The capture has one row for each run of a layer: 6 plus 3 times 12 plus 6 is 48 rows. The three passes use the same weights, so prune-moe-kit sums the counts of the three passes and makes one rank and one keep list for each layer. The three passes share 52% of their drop lists. At K 112, a pass loses 1.99% of its routing with the rank of the sum, and 1.55% with its own rank.</desc>
